server {
    listen 80;
    server_name centredesvarices.dz www.centredesvarices.dz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name centredesvarices.dz www.centredesvarices.dz;

    # SSL Let's Encrypt — généré via certbot
    ssl_certificate /etc/letsencrypt/live/centredesvarices.dz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/centredesvarices.dz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Static files
    location /_next/static {
        alias /var/www/centredesvarices/.next/static;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location /public {
        alias /var/www/centredesvarices/public;
        expires 30d;
        access_log off;
    }

    # Proxy to Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
